# Nginx du serveur VPS (hors Docker), devant les conteneurs.
# Installation :
#   sudo cp nginx-senlab.conf /etc/nginx/sites-available/senlab
#   sudo ln -s /etc/nginx/sites-available/senlab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d senlab.site -d api.senlab.site -d ia.senlab.site
# Certbot ajoute lui-même les blocs HTTPS (443) et la redirection HTTP -> HTTPS.

# En-têtes transmis aux conteneurs, répétés dans chaque bloc server : placés
# en tête de fichier, ils s'appliqueraient aussi aux autres sites du serveur.
# X-Forwarded-Proto indique à Django que la requête d'origine est en HTTPS
# (cookies sécurisés, CSRF).

# Frontend Angular
server {
    listen 80;
    server_name senlab.site;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}

# API Django (admin, fichiers envoyés)
server {
    listen 80;
    server_name api.senlab.site;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Manuels PDF (10 Mo max côté Django) et photos.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_read_timeout 180s;
    }
}

# Service IA (FastAPI) : l'inférence du modèle sur CPU peut être longue.
server {
    listen 80;
    server_name ia.senlab.site;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_read_timeout 300s;
    }
}
